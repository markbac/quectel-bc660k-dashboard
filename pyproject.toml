[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quectel-bc660k-dashboard"
version = "0.1.0"
description = "Signal and network web dashboard for the Quectel BC660K-GL NB-IoT module"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyserial>=3.5",
    "websockets>=11.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
quectel-dashboard = "server:main"

[tool.setuptools]
py-modules = [
    "at_channel", "cli", "db_manager", "instance", "port_detect",
    "security", "serial_manager", "server", "timers",
]
packages = ["pylogkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
